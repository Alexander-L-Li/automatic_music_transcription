[project]
name = "frozen-prior-amt"
version = "0.1.0"
description = "Budget-constrained proof of concept for frozen-prior ControlNet audio-to-MIDI transcription."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "librosa>=0.10.2",
  "matplotlib>=3.8",
  "mido>=1.3.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "pretty_midi>=0.2.10",
  "pyyaml>=6.0",
  "remotezip>=0.12.3",
  "requests>=2.31",
  "soundfile>=0.12",
  "tqdm>=4.66",
]

[project.scripts]
fpamt = "frozen_prior_amt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frozen_prior_amt"]

